<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="440" viewBox="0 0 1800 440">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00B7FF"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="right" x1="0.18" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#078BFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Approved geometric A monogram in its rounded-square frame -->
  <rect x="28" y="42" width="356" height="356" rx="78" fill="#10131B"/>
  <rect x="28" y="42" width="356" height="356" rx="78" fill="none" stroke="url(#frame)" stroke-width="8"/>
  <g transform="translate(28 42) scale(0.34765625)">
    <path d="M252 806 399 806 692 245 548 245Z" fill="#FFFFFF"/>
    <path d="M692 245 916 806 766 806 616 410Z" fill="url(#right)"/>
    <path d="M420 760 675 585 548 585Z" fill="url(#fold)"/>
  </g>

  <!-- Wordmark -->
  <text x="455" y="222" fill="#FFFFFF"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="104" font-weight="700" letter-spacing="1.2">ARYAN AGARWAL</text>
  <text x="460" y="304" fill="url(#label)"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="39" font-weight="600" letter-spacing="8">FULL-STACK DEVELOPER</text>
</svg>